<!DOCTYPE html>
<html>
<head>
    <title>Simple charan App</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f0f0f0; }
        .chat-box { background: #fff; padding: 20px; border-radius: 10px; max-width: 600px; margin: auto; }
        .message { padding: 10px; border-bottom: 1px solid #eee; }
        .message:last-child { border-bottom: none; }
        form { margin-top: 20px; }
        input[type="text"] { padding: 10px; width: 40%; margin-right: 10px; }
        input[type="submit"] { padding: 10px 20px; }
    </style>
</head>
<body>
    <div class="chat-box">
        <h2>Community Chat</h2>
        
        {% for msg in messages %}
            <div class="message">
                <strong>{{ msg.username }}:</strong> {{ msg.message }}
            </div>
        {% endfor %}
        
        <form method="POST">
            <input type="text" name="username" placeholder="Your Name" required>
            <input type="text" name="message" placeholder="Your Message" required>
            <input type="submit" value="Send">
        </form>
    </div>
</body>
</html>
